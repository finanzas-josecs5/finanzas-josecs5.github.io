version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    # Espera 7 días antes de proponer versiones nuevas (ataques a la cadena de suministro)
    cooldown: { default-days: 7 }
    groups:
      desarrollo: { dependency-type: development }
    ignore:
      # typescript-eslint aún no admite TypeScript 7 (peer: typescript <6.1). Revisar cuando lo haga.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
