version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    # Espera 7 días antes de proponer versiones nuevas (ataques a la cadena de suministro)
    cooldown: { default-days: 7 }
    groups:
      desarrollo: { dependency-type: development }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
